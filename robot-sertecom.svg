<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Logo Sertecom — Robot animado</title>
<desc>Robot tecnológico con la S de Sertecom en el pecho, animado</desc>

<defs>
  <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2a2a2a"/>
    <stop offset="50%" stop-color="#1a1a1a"/>
    <stop offset="100%" stop-color="#111"/>
  </linearGradient>
  <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#9BDD2B"/>
    <stop offset="100%" stop-color="#5a9015"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<style>
  .float-body { animation: floatBody 3s ease-in-out infinite; transform-origin: 340px 260px; }
  @keyframes floatBody { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

  .head-group { transform-origin: 340px 155px; animation: headBob 3s ease-in-out infinite; }
  @keyframes headBob {
    0%,100%{transform:translateY(0) rotate(0deg)}
    25%{transform:translateY(-12px) rotate(-3deg)}
    75%{transform:translateY(-12px) rotate(3deg)}
  }

  .eye-left, .eye-right { animation: blink 4s ease-in-out infinite; transform-origin: center; }
  @keyframes blink { 0%,90%,100%{transform:scaleY(1)} 95%{transform:scaleY(0.08)} }
  .eye-right { animation-delay: 0.1s; }

  .eye-glow { animation: eyeGlow 3s ease-in-out infinite; }
  @keyframes eyeGlow { 0%,100%{opacity:0.6} 50%{opacity:1} }

  .antenna-ball { animation: antennaPulse 1.5s ease-in-out infinite; transform-origin: 340px 88px; }
  @keyframes antennaPulse { 0%,100%{r:7;opacity:0.8} 50%{r:10;opacity:1} }

  .arm-left  { transform-origin: 258px 290px; animation: armSwingL 3s ease-in-out infinite; }
  @keyframes armSwingL { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-18deg)} 75%{transform:rotate(8deg)} }

  .arm-right { transform-origin: 422px 290px; animation: armSwingR 3s ease-in-out infinite; }
  @keyframes armSwingR { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(18deg)} 75%{transform:rotate(-8deg)} }

  .leg-left  { transform-origin: 305px 400px; animation: legSwingL 3s ease-in-out infinite; }
  @keyframes legSwingL { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(8deg)} 75%{transform:rotate(-8deg)} }

  .leg-right { transform-origin: 375px 400px; animation: legSwingR 3s ease-in-out infinite; }
  @keyframes legSwingR { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }

  .chest-s { animation: sGlow 2s ease-in-out infinite; }
  @keyframes sGlow { 0%,100%{opacity:0.9} 50%{opacity:1} }

  .chest-light  { animation: lightPulse 2s ease-in-out infinite; }
  .chest-light2 { animation: lightPulse 2s ease-in-out infinite 0.6s; }
  .chest-light3 { animation: lightPulse 2s ease-in-out infinite 1.2s; }
  @keyframes lightPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

  .shadow { animation: shadowPulse 3s ease-in-out infinite; transform-origin: 340px 470px; }
  @keyframes shadowPulse { 0%,100%{transform:scaleX(1);opacity:0.25} 50%{transform:scaleX(0.7);opacity:0.12} }

  .spark1 { animation: spark 4s ease-in-out infinite; }
  .spark2 { animation: spark 4s ease-in-out infinite 1.3s; }
  .spark3 { animation: spark 4s ease-in-out infinite 2.6s; }
  @keyframes spark {
    0%{opacity:0;transform:translate(0,0) scale(0)}
    20%{opacity:1;transform:translate(-10px,-20px) scale(1)}
    80%{opacity:0.3;transform:translate(-15px,-50px) scale(0.6)}
    100%{opacity:0;transform:translate(-18px,-70px) scale(0)}
  }

  .brand-text { font-family:'Rajdhani','Arial Black',sans-serif; font-weight:700; font-size:38px; letter-spacing:8px; fill:#f5f5f5; }
  .brand-sub  { font-family:'Exo 2',Arial,sans-serif; font-size:13px; letter-spacing:5px; fill:#7DC31F; }
  .brand-s    { fill:#7DC31F; }
</style>

<ellipse class="shadow" cx="340" cy="468" rx="90" ry="12" fill="#7DC31F"/>

<g class="float-body">
  <g class="leg-left">
    <rect x="293" y="400" width="34" height="52" rx="8" fill="url(#metalGrad)" stroke="#7DC31F" stroke-width="1.2"/>
    <rect x="288" y="446" width="44" height="14" rx="5" fill="#222" stroke="#7DC31F" stroke-width="1"/>
    <rect x="300" y="404" width="8" height="20" rx="3" fill="#7DC31F" opacity="0.3"/>
  </g>
  <g class="leg-right">
    <rect x="353" y="400" width="34" height="52" rx="8" fill="url(#metalGrad)" stroke="#7DC31F" stroke-width="1.2"/>
    <rect x="348" y="446" width="44" height="14" rx="5" fill="#222" stroke="#7DC31F" stroke-width="1"/>
    <rect x="372" y="404" width="8" height="20" rx="3" fill="#7DC31F" opacity="0.3"/>
  </g>

  <g class="arm-left">
    <circle cx="258" cy="278" r="14" fill="#222" stroke="#7DC31F" stroke-width="1.5"/>
    <rect x="240" y="278" width="24" height="60" rx="10" fill="url(#metalGrad)" stroke="#7DC31F" stroke-width="1.2"/>
    <rect x="236" y="332" width="32" height="22" rx="8" fill="#1a1a1a" stroke="#7DC31F" stroke-width="1.2"/>
    <rect x="238" y="352" width="6" height="12" rx="3" fill="#222" stroke="#7DC31F" stroke-width="0.8"/>
    <rect x="247" y="352" width="6" height="14" rx="3" fill="#222" stroke="#7DC31F" stroke-width="0.8"/>
    <rect x="256" y="352" width="6" height="12" rx="3" fill="#222" stroke="#7DC31F" stroke-width="0.8"/>
    <rect x="244" y="295" width="12" height="4" rx="2" fill="#7DC31F" opacity="0.5"/>
  </g>
  <g class="arm-right">
    <circle cx="422" cy="278" r="14" fill="#222" stroke="#7DC31F" stroke-width="1.5"/>
    <rect x="416" y="278" width="24" height="60" rx="10" fill="url(#metalGrad)" stroke="#7DC31F" stroke-width="1.2"/>
    <rect x="412" y="332" width="32" height="22" rx="8" fill="#1a1a1a" stroke="#7DC31F" stroke-width="1.2"/>
    <rect x="414" y="352" width="6" height="12" rx="3" fill="#222" stroke="#7DC31F" stroke-width="0.8"/>
    <rect x="423" y="352" width="6" height="14" rx="3" fill="#222" stroke="#7DC31F" stroke-width="0.8"/>
    <rect x="432" y="352" width="6" height="12" rx="3" fill="#222" stroke="#7DC31F" stroke-width="0.8"/>
    <rect x="424" y="295" width="12" height="4" rx="2" fill="#7DC31F" opacity="0.5"/>
  </g>

  <rect x="270" y="255" width="140" height="150" rx="18" fill="url(#metalGrad)" stroke="#7DC31F" stroke-width="1.8"/>
  <rect x="282" y="268" width="116" height="124" rx="12" fill="#111" stroke="#7DC31F" stroke-width="0.8" opacity="0.7"/>
  <text class="chest-s" x="340" y="352" text-anchor="middle"
    font-family="'Rajdhani','Arial Black',sans-serif"
    font-size="90" font-weight="700"
    fill="url(#greenGrad)" filter="url(#glow)">S</text>
  <circle class="chest-light"  cx="293" cy="272" r="5" fill="#7DC31F"/>
  <circle class="chest-light2" cx="307" cy="272" r="5" fill="#7DC31F"/>
  <circle class="chest-light3" cx="321" cy="272" r="5" fill="#7DC31F"/>
  <rect x="318" y="240" width="44" height="18" rx="6" fill="#1a1a1a" stroke="#7DC31F" stroke-width="1.2"/>
  <rect x="326" y="244" width="28" height="8" rx="3" fill="#7DC31F" opacity="0.3"/>

  <g class="head-group">
    <line x1="340" y1="88" x2="340" y2="138" stroke="#7DC31F" stroke-width="2"/>
    <circle class="antenna-ball" cx="340" cy="84" r="7" fill="#7DC31F" filter="url(#glow)"/>
    <circle cx="340" cy="84" r="3" fill="#fff" opacity="0.7"/>
    <rect x="282" y="138" width="116" height="104" rx="20" fill="url(#metalGrad)" stroke="#7DC31F" stroke-width="1.8"/>
    <rect x="290" y="148" width="100" height="52" rx="12" fill="#0d0d0d" stroke="#7DC31F" stroke-width="1"/>
    <g class="eye-left" style="transform-origin:312px 174px">
      <rect x="298" y="160" width="28" height="28" rx="6" fill="#0a0a0a" stroke="#7DC31F" stroke-width="1.2"/>
      <circle class="eye-glow" cx="312" cy="174" r="9" fill="#7DC31F" filter="url(#glow)"/>
      <circle cx="312" cy="174" r="5" fill="#fff" opacity="0.9"/>
      <circle cx="314" cy="172" r="2" fill="#0a0a0a"/>
    </g>
    <g class="eye-right" style="transform-origin:368px 174px">
      <rect x="354" y="160" width="28" height="28" rx="6" fill="#0a0a0a" stroke="#7DC31F" stroke-width="1.2"/>
      <circle class="eye-glow" cx="368" cy="174" r="9" fill="#7DC31F" filter="url(#glow)"/>
      <circle cx="368" cy="174" r="5" fill="#fff" opacity="0.9"/>
      <circle cx="370" cy="172" r="2" fill="#0a0a0a"/>
    </g>
    <rect x="308" y="206" width="64" height="18" rx="5" fill="#0d0d0d" stroke="#7DC31F" stroke-width="0.8"/>
    <rect x="313" y="210" width="8"  height="10" rx="2" fill="#7DC31F" opacity="0.7"/>
    <rect x="325" y="210" width="8"  height="10" rx="2" fill="#7DC31F" opacity="0.5"/>
    <rect x="337" y="210" width="8"  height="10" rx="2" fill="#7DC31F" opacity="0.7"/>
    <rect x="349" y="210" width="8"  height="10" rx="2" fill="#7DC31F" opacity="0.5"/>
    <rect x="361" y="210" width="6"  height="10" rx="2" fill="#7DC31F" opacity="0.7"/>
    <rect x="266" y="158" width="18" height="34" rx="6" fill="#1a1a1a" stroke="#7DC31F" stroke-width="1"/>
    <circle cx="275" cy="175" r="5" fill="#7DC31F" opacity="0.6"/>
    <rect x="396" y="158" width="18" height="34" rx="6" fill="#1a1a1a" stroke="#7DC31F" stroke-width="1"/>
    <circle cx="405" cy="175" r="5" fill="#7DC31F" opacity="0.6"/>
    <rect x="326" y="148" width="28" height="4" rx="2" fill="#7DC31F" opacity="0.25"/>
  </g>

  <circle class="spark1" cx="430" cy="310" r="3" fill="#7DC31F"/>
  <circle class="spark2" cx="252" cy="300" r="2" fill="#9BDD2B"/>
  <circle class="spark3" cx="420" cy="270" r="2.5" fill="#7DC31F"/>
</g>

<text class="brand-text" x="340" y="500" text-anchor="middle">
  <tspan class="brand-s">S</tspan>ERTECOM
</text>
<text class="brand-sub" x="340" y="518" text-anchor="middle">SERVICIO PROFESIONAL</text>
</svg>
